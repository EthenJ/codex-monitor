[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-monitor"
version = "0.2.1"
description = "Event-driven callbacks and training watchdogs for Codex sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Codex Monitor contributors" }]
dependencies = []

[project.optional-dependencies]
platform = [
  "watchdog>=6.0,<7",
  "psutil>=5.9,<8",
]

[tool.setuptools]
packages = []
