name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install legacy platform dependencies
        run: python -m pip install -e ".[platform]"
      - name: Validate skill manifest
        run: python tools/validate_skill.py codex-monitor
      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  minimal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate skill manifest
        run: python tools/validate_skill.py codex-monitor
      - name: Run without optional platform dependencies
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  node:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package

  network-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build isolated native network fixtures
        run: docker build -f tests/container/Dockerfile -t codex-monitor-network-test .
      - name: Test with external networking disabled
        run: docker run --rm --network none codex-monitor-network-test
      - name: Build full Ubuntu 24.04 validation
        run: docker build -f tests/container/Dockerfile.ubuntu -t codex-monitor-ubuntu-test .
      - name: Run full native suite as a regular Ubuntu user
        run: docker run --rm --init --network none codex-monitor-ubuntu-test
