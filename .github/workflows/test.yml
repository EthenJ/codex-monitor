name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install plugin and platform dependencies
        run: python -m pip install -e ".[plugin,platform]"
      - name: Validate skill manifest
        run: python tools/validate_skill.py codex-monitor
      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  minimal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate skill manifest
        run: python tools/validate_skill.py codex-monitor
      - name: Run without optional platform dependencies
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
