name: test

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional platform dependencies
        run: python -m pip install -e ".[platform]"
      - name: Validate skill manifest
        run: python tools/validate_skill.py codex-monitor
      - name: Run tests
        run: python -m unittest discover -s tests -v
